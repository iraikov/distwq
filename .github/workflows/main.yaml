name: distwq CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # mpi4py uses Open MPI, which can spawn processes; Ubuntu's MPICH
      # cannot.
      MPI4PY_MPIABI: openmpi
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev

      - name: Install distwq and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test

      - name: Run the tests
        run: bash tests/run_ci.sh
